[build]
  command = "npx expo export -p web"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/mealpulse.mobileconfig"
  [headers.values]
    Content-Type = "application/x-apple-aspen-config"
    Content-Disposition = "attachment; filename=\"mealpulse.mobileconfig\""

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
